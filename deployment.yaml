apiVersion: apps/v1
kind: Deployment
metadata:
  name: project14-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project14-app
  template:
    metadata:
      labels:
        app: project14-app
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
